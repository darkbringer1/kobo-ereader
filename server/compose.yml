name: kobo-terminus

x-application: &application
  image: ghcr.io/usetrmnl/terminus:0.78.0
  init: true
  restart: unless-stopped
  environment: &environment
    HANAMI_PORT: 2300
    API_URI: ${API_URI}
    APP_SECRET: ${APP_SECRET}
    DATABASE_URL: postgres://terminus:${DATABASE_PASSWORD}@database:5432/terminus
    KEYVALUE_URL: redis://:${KEYVALUE_PASSWORD}@keyvalue:6379/0
    FIRMWARE_SYNCHRONIZER: false
    FONT_SYNCHRONIZER: false
    MODEL_SYNCHRONIZER: false
  volumes:
    - uploads:/app/public/uploads
    - fonts:/app/public/fonts
    - fonts:/usr/share/fonts/terminus

services:
  database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: terminus
      POSTGRES_DB: terminus
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U terminus -d terminus']
      interval: 5s
      timeout: 3s
      retries: 20

  keyvalue:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${KEYVALUE_PASSWORD}
    command: [sh, -c, 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction']
    volumes:
      - keyvalue:/data
    healthcheck:
      test: [CMD-SHELL, 'VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *application
    environment:
      <<: *environment
      APP_SETUP: true
    ports:
      - '${SERVER_BIND_ADDRESS:-0.0.0.0}:2300:2300'
    depends_on:
      database:
        condition: service_healthy
      keyvalue:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:2300/up']
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s

  worker:
    <<: *application
    command: [bundle, exec, sidekiq, -r, ./config/sidekiq.rb]
    depends_on:
      web:
        condition: service_healthy

volumes:
  database:
  keyvalue:
  uploads:
  fonts:
