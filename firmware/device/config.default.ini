# KoboDash Custom Firmware Configuration
# Editable on-device (Settings screen) or over USB/SSH.

[display]
minute_clock = 1
invert_mode = 0
clock_24h = 1
full_refresh_every = 15
gallery_clock_overlay = 1
start_screen = clock

[reader]
reader_font_px = 24
reader_line_spacing = 1
reader_flash_every = 5
reader_font_family = georgia
dict_lang = en

[schedule]
day_interval_min = 30
night_interval_min = 120
day_start_hour = 7
night_start_hour = 23
auto_rotate_min = 0

[time]
tz_posix = CET-1CEST,M3.5.0,M10.5.0/3
ntp_server = pool.ntp.org

[server]
# Point to your own HTTPS or HTTP server URL returning either:
#   - A KoboDash multi-page JSON bundle (/kobo/bundle), or
#   - A 600x800 PNG / JPG / BMP / GIF image, or
#   - Legacy JSON: {"title":"...","subtitle":"...","lines":["...",...]}
# Supports ETag / 304 Not Modified and sends X-Kobo-Battery / X-Kobo-RSSI headers.
# Example: server_url = https://dashboard.example.com/kobo/bundle
server_url =
server_token =
push_mode = 1

[gallery]
# Auto-scans /mnt/sd/screensavers, /mnt/sd/images, /mnt/sd, and .adds/kobodash/screensavers
screensaver_dir =

[touch]
# Defaults for Kobo Touch A (N905 / neonode_ts)
touch_swap_xy = 1
touch_mirror_x = 1
touch_mirror_y = 0

[device]
cpu_governor =
auto_boot = 1
